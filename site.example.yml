storage:
  prometheus_volume: spark-monitoring_prometheus-data
  grafana_volume: spark-monitoring_grafana-data

grafana:
  serve_host: monitoring.example.invalid
  serve_port: 8443

prometheus:
  cluster: example-cluster
  node_exporter_node: node-a

serving_nodes:
  - name: node-a
    running_url: http://127.0.0.1:30000
    gateway_scrape:
      job: gateway-node-a
      target: 127.0.0.1:30000
  - name: node-b
    running_url: https://gateway.example.invalid:443
    gateway_scrape:
      job: gateway-node-b
      target: gateway.example.invalid:443
      scheme: https

model_telemetry:
  - node: node-a
    identities:
      - running: demo-vllm-model
        model: demo-vllm-model
      - running: demo-vllm-model-alt
        model: demo-vllm-model-alt
    engine: vllm
    proxy_port: 32100
    activity_metric: vllm:num_requests_running
    model_label_source: model_name
    scrape:
      job: vllm-node-a
      target: 127.0.0.1:32100

  - node: node-a
    identities:
      - running: demo-sglang-model
        model: demo-sglang-model
    engine: sglang
    proxy_port: 32101
    activity_metric: sglang:num_running_reqs
    scrape:
      job: sglang-node-a
      target: 127.0.0.1:32101

  - node: node-a
    identities:
      - running: demo-tensorfold-model
        model: demo-tensorfold-model
    engine: tensorfold
    proxy_port: 32103
    activity_metric: tensorfold:requests_running
    scrape:
      job: tensorfold-node-a
      target: 127.0.0.1:32103

  - node: node-b
    identities:
      - running: demo-llamacpp-model
        model: node-b/demo-llamacpp-model
    engine: llamacpp
    proxy_port: 32102
    activity_metric: llamacpp:requests_processing
    scrape:
      job: llamacpp-node-b
      target: gateway.example.invalid:443
      scheme: https
      metrics_path: /workers/demo-llamacpp/metrics
